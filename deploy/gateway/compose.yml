name: infra-gateway

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      BASE_DOMAIN: "${BASE_DOMAIN:?Configure BASE_DOMAIN}"
      BIPAGEM_SUBDOMAIN: "${BIPAGEM_SUBDOMAIN:-bipagem}"
      NOTAS_SUBDOMAIN: "${NOTAS_SUBDOMAIN:-notas}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

networks:
  edge:
    external: true
    name: edge

volumes:
  caddy_data:
  caddy_config:
